; Bundled PHP for Автоперална Павлинка. The agent adds extension_dir, session.save_path
; and error_log on the command line, because they depend on the install folder.
extension=pdo_sqlite
extension=mbstring
date.timezone = Europe/Skopje
default_charset = "UTF-8"
display_errors = Off
log_errors = On
expose_php = Off
memory_limit = 128M
max_execution_time = 30
post_max_size = 8M
session.use_strict_mode = 1
session.cookie_httponly = 1
