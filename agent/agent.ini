# Peralna agent settings (one reader = one machine)

# Machine code, must match the code on the "Цени" page.
machine = B1

# Billing server (the admin panel). The agent starts it itself on web_port.
server = http://127.0.0.1:8080/api.php

# Port of the admin panel: http://localhost:8080/  (0 = do not start it)
web_port = 8080

# 127.0.0.1 = admin panel only on this computer; 0.0.0.0 = also from other devices on the LAN.
web_bind = 127.0.0.1

# Only needed if api_key is set in config.php.
api_key =

# Port the PLC connects to (Modbus TCP standard is 502).
modbus_port = 502

# Part of the reader name to use; empty = first reader found.
reader =

# How often the server is told the card is still inside.
tick_seconds = 15

# Stop the machine if the server cannot be reached for this long.
offline_stop_seconds = 45

# 1 = no reader: type "in <UID>" / "out" in the agent window to test the PLC.
simulate = 0
